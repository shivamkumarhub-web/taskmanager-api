version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: "ThisIsASecretKeyForJwtTokenGenerationAndItShouldBeLongEnoughForHS256AlgorithmToWorkProperly"
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: